<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Chat Cleaner</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #eab308;
      --code-bg: #090d16;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border); gap: 1rem; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 300px; }
    header h1 { font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
    select, input[type="text"], button { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.75rem; border-radius: 4px; font-size: 0.9rem; }
    select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input[type="text"] { flex: 1; max-width: 350px; }
    
    .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; color: var(--text-muted); }
    .btn { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    .btn:hover { background: var(--border); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }

    .main-container { display: flex; flex: 1; height: calc(100vh - 57px); overflow: hidden; }
    
    .left-pane { width: 45%; min-width: 350px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg); }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-row { display: flex; align-items: flex-start; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); cursor: pointer; gap: 0.75rem; transition: background 0.15s; }
    .chat-row:hover { background: var(--surface); }
    .chat-row.selected { background: rgba(59, 130, 246, 0.15); border-left: 3px solid var(--accent); }
    .chat-row input[type="checkbox"] { margin-top: 0.2rem; cursor: pointer; }
    .chat-row input[type="checkbox"]:disabled { cursor: not-allowed; }
    
    .chat-info { flex: 1; min-width: 0; }
    .chat-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .chat-id-badge { font-family: monospace; background: var(--surface); padding: 0.1rem 0.3rem; border-radius: 3px; border: 1px solid var(--border); }
    .chat-snippet { font-size: 0.9rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-tag { font-size: 0.75rem; background: #334155; padding: 0.1rem 0.4rem; border-radius: 3px; margin-right: 0.5rem; color: #cbd5e1; }
    .live-badge { background: rgba(234, 179, 8, 0.2); color: var(--warning); border: 1px solid var(--warning); font-size: 0.7rem; padding: 0.1rem 0.3rem; border-radius: 3px; font-weight: 600; margin-left: 0.5rem; }

    .left-footer { padding: 0.75rem 1rem; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; flex-wrap: wrap; gap: 0.5rem; }
    .footer-actions { display: flex; gap: 0.5rem; align-items: center; }

    .right-pane { flex: 55%; display: flex; flex-direction: column; background: var(--code-bg); overflow: hidden; }
    .transcript-header { padding: 0.75rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
    .transcript-body { flex: 1; overflow-y: auto; padding: 1.25rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg { margin-bottom: 1.25rem; border-left: 3px solid var(--border); padding-left: 0.75rem; }
    .msg.user { border-left-color: var(--accent); }
    .msg.assistant { border-left-color: #10b981; }
    .msg.tool { border-left-color: var(--warning); }
    .msg-role { font-weight: bold; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.25rem; color: var(--text-muted); }
    .msg.user .msg-role { color: var(--accent); }
    .msg.assistant .msg-role { color: #10b981; }
    .msg.tool .msg-role { color: var(--warning); }
    .placeholder-right { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 1rem; }
    .truncated-warning { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; padding: 0.5rem 1rem; font-size: 0.85rem; margin-bottom: 1rem; border-radius: 4px; }

    /* Trash Modal */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: var(--surface); border: 1px solid var(--border); width: 600px; max-width: 90%; max-height: 80vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
    .modal-body { padding: 1rem; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.75rem; }
    .trash-batch-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.5rem; background: var(--bg); }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.25rem; cursor: pointer; }
    .close-btn:hover { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Claude Chat Cleaner</h1>
      <select id="projectSelect" onchange="onProjectChange()">
        <option value="ALL">All projects</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search first message or ID..." oninput="renderChats()">
    </div>
    <div class="header-right">
      <span id="statsLabel">0 chats (0 B)</span>
      <button class="btn" onclick="openTrashModal()">Trash</button>
    </div>
  </header>

  <div class="main-container">
    <div class="left-pane">
      <div class="chat-list" id="chatList">
        <!-- Chat rows populated here -->
      </div>
      <div class="left-footer">
        <span id="selectionLabel">0 selected (0 B)</span>
        <div class="footer-actions">
          <button class="btn" onclick="selectAllVisible()">Select all visible</button>
          <button class="btn" onclick="clearSelection()">Clear</button>
          <button class="btn btn-danger" onclick="deleteSelected()">Delete selected</button>
        </div>
      </div>
    </div>

    <div class="right-pane" id="rightPane">
      <div class="placeholder-right">Select a chat to view transcript</div>
    </div>
  </div>

  <!-- Trash Modal -->
  <div class="modal-backdrop" id="trashModal">
    <div class="modal">
      <div class="modal-header">
        <span>Trash Batches</span>
        <button class="close-btn" onclick="closeTrashModal()">&times;</button>
      </div>
      <div class="modal-body" id="trashModalBody">
        Loading trash...
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" onclick="purgeTrash()">Empty trash (permanent)</button>
        <button class="btn" onclick="closeTrashModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    let projects = [];
    let chats = [];
    let selectedProject = 'ALL';
    let selectedChatKey = null; // "project:id"
    let selectedItems = new Set(); // "project:id"

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDate(ms) {
      const d = new Date(ms);
      return d.toLocaleString();
    }

    async function init() {
      await loadProjects();
      await loadChats();
    }

    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        projects = await res.json();
        const select = document.getElementById('projectSelect');
        // Keep "All projects"
        select.innerHTML = '<option value="ALL">All projects</option>';
        projects.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.dir;
          opt.textContent = `${p.label} (${p.count}, ${formatBytes(p.totalBytes)})`;
          select.appendChild(opt);
        });
        select.value = selectedProject;
      } catch (e) {
        console.error('Failed to load projects', e);
      }
    }

    async function loadChats() {
      try {
        const res = await fetch(`/api/chats?project=${encodeURIComponent(selectedProject)}`);
        chats = await res.json();
        renderChats();
        updateStats();
      } catch (e) {
        console.error('Failed to load chats', e);
      }
    }

    function onProjectChange() {
      selectedProject = document.getElementById('projectSelect').value;
      selectedChatKey = null;
      selectedItems.clear();
      document.getElementById('rightPane').innerHTML = '<div class="placeholder-right">Select a chat to view transcript</div>';
      loadChats();
    }

    function renderChats() {
      const listEl = document.getElementById('chatList');
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = chats.filter(c => {
        if (!query) return true;
        return c.id.toLowerCase().includes(query) || c.firstMessage.toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--text-muted);">No chats found</div>';
        return;
      }

      let html = '';
      filtered.forEach(c => {
        const key = `${c.project}:${c.id}`;
        const isSelected = selectedChatKey === key;
        const isChecked = selectedItems.has(key);
        const shortId = c.id.substring(0, 8);

        html += `
          <div class="chat-row ${isSelected ? 'selected' : ''}" onclick="selectChat('${c.project}', '${c.id}')">
            <input type="checkbox" ${isChecked ? 'checked' : ''} ${c.live ? 'disabled' : ''} onclick="event.stopPropagation(); toggleCheckbox('${c.project}', '${c.id}', this)">
            <div class="chat-info">
              <div class="chat-meta">
                <span>
                  ${selectedProject === 'ALL' ? `<span class="project-tag">${escapeHtml(c.project)}</span>` : ''}
                  <span class="chat-id-badge">${shortId}</span>
                  ${c.live ? '<span class="live-badge">LIVE</span>' : ''}
                </span>
                <span>${formatDate(c.mtime)} (${formatBytes(c.bytes)})</span>
              </div>
              <div class="chat-snippet">${escapeHtml(c.firstMessage)}</div>
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;
      updateSelectionLabel();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function updateStats() {
      const totalCount = chats.length;
      const totalBytes = chats.reduce((acc, c) => acc + c.bytes, 0);
      document.getElementById('statsLabel').textContent = `${totalCount} chats (${formatBytes(totalBytes)})`;
    }

    function updateSelectionLabel() {
      let count = 0;
      let bytes = 0;
      selectedItems.forEach(key => {
        const [proj, id] = key.split(':');
        const c = chats.find(x => x.project === proj && x.id === id);
        if (c) {
          count++;
          bytes += c.bytes;
        }
      });
      document.getElementById('selectionLabel').textContent = `${count} selected (${formatBytes(bytes)})`;
    }

    function toggleCheckbox(project, id, checkbox) {
      const key = `${project}:${id}`;
      if (checkbox.checked) {
        selectedItems.add(key);
      } else {
        selectedItems.delete(key);
      }
      updateSelectionLabel();
    }

    function selectAllVisible() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      chats.forEach(c => {
        if (!c.live) {
          const match = !query || c.id.toLowerCase().includes(query) || c.firstMessage.toLowerCase().includes(query);
          if (match) {
            selectedItems.add(`${c.project}:${c.id}`);
          }
        }
      });
      renderChats();
    }

    function clearSelection() {
      selectedItems.clear();
      renderChats();
    }

    async function selectChat(project, id) {
      selectedChatKey = `${project}:${id}`;
      renderChats();

      const rightPane = document.getElementById('rightPane');
      rightPane.innerHTML = '<div class="placeholder-right">Loading transcript...</div>';

      try {
        const res = await fetch(`/api/chat?project=${encodeURIComponent(project)}&id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.error) {
          rightPane.innerHTML = `<div class="placeholder-right" style="color: var(--danger);">${escapeHtml(data.error)}</div>`;
          return;
        }

        let html = `
          <div class="transcript-header">
            <span>Transcript: ${escapeHtml(id)}</span>
            <span style="color: var(--text-muted); font-size: 0.8rem;">Size: ${formatBytes(data.size)}</span>
          </div>
          <div class="transcript-body">
        `;

        if (data.truncated) {
          html += `<div class="truncated-warning">File size exceeds 5MB. Transcript has been truncated.</div>`;
        }

        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(m => {
            let roleClass = 'user';
            if (m.role === 'assistant') roleClass = 'assistant';
            else if (m.role === 'tool' || m.role === 'tool_result') roleClass = 'tool';

            html += `
              <div class="msg ${roleClass}">
                <div class="msg-role">${escapeHtml(m.role)}</div>
                <div class="msg-text">${escapeHtml(m.text)}</div>
              </div>
            `;
          });
        } else {
          html += '<div style="color: var(--text-muted); text-align: center;">No messages found in transcript</div>';
        }

        html += '</div>';
        rightPane.innerHTML = html;
      } catch (e) {
        rightPane.innerHTML = `<div class="placeholder-right" style="color: var(--danger);">Failed to load transcript</div>`;
      }
    }

    async function deleteSelected() {
      if (selectedItems.size === 0) {
        alert('No chats selected');
        return;
      }

      if (!confirm(`Are you sure you want to delete ${selectedItems.size} selected chat(s) to trash?`)) {
        return;
      }

      const items = [];
      selectedItems.forEach(key => {
        const [project, id] = key.split(':');
        items.push({ project, id });
      });

      try {
        const res = await fetch('/api/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Cleaner': '1' },
          body: JSON.stringify({ items })
        });
        const data = await res.json();
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          const failed = (data.results || []).filter(r => !r.success);
          if (failed.length) alert('Some failed:\n' + failed.map(r => r.id + ': ' + r.error).join('\n'));
          selectedItems.clear();
          selectedChatKey = null;
          document.getElementById('rightPane').innerHTML = '<div class="placeholder-right">Select a chat to view transcript</div>';
          await init();
        }
      } catch (e) {
        alert('Failed to delete selected chats');
      }
    }

    async function openTrashModal() {
      document.getElementById('trashModal').style.display = 'flex';
      await loadTrashBatches();
    }

    function closeTrashModal() {
      document.getElementById('trashModal').style.display = 'none';
    }

    async function loadTrashBatches() {
      const bodyEl = document.getElementById('trashModalBody');
      bodyEl.innerHTML = 'Loading trash batches...';
      try {
        const res = await fetch('/api/trash');
        const batches = await res.json();

        if (batches.length === 0) {
          bodyEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">Trash is empty</div>';
          return;
        }

        let html = '';
        batches.forEach(b => {
          html += `
            <div class="trash-batch-item">
              <div>
                <div style="font-weight: 500;">Batch: ${formatDate(b.timestamp)}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">${b.itemsCount} item(s), ${formatBytes(b.totalBytes)}</div>
              </div>
              <button class="btn btn-primary" onclick="restoreBatch('${b.batch}')">Restore</button>
            </div>
          `;
        });
        bodyEl.innerHTML = html;
      } catch (e) {
        bodyEl.innerHTML = '<div style="color: var(--danger); text-align: center;">Failed to load trash</div>';
      }
    }

    async function restoreBatch(batch) {
      if (!confirm('Are you sure you want to restore this trash batch?')) return;
      try {
        const res = await fetch('/api/restore', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Cleaner': '1' },
          body: JSON.stringify({ batch })
        });
        const data = await res.json();
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          await loadTrashBatches();
          await init();
        }
      } catch (e) {
        alert('Failed to restore batch');
      }
    }

    async function purgeTrash() {
      if (!confirm('WARNING: Permanently delete all items in trash? This cannot be undone.')) return;
      try {
        const res = await fetch('/api/purge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Cleaner': '1' },
          body: '{}'
        });
        const data = await res.json();
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          await loadTrashBatches();
          await init();
        }
      } catch (e) {
        alert('Failed to purge trash');
      }
    }

    window.onload = init;
  </script>
</body>
</html>
